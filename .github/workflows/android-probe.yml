name: Android Perchance compatibility probe
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_network_probe:
        description: 'Explicitly run the live Perchance test'
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: android-probe-${{ github.sha }}
  cancel-in-progress: true
jobs:
  fanta_ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build FANTA and install browser test dependency
        run: |
          node warhammer/build.cjs
          node workshops/build.cjs
          npm install --no-save --prefix /tmp/fanta-browser playwright@1.62.1
          /tmp/fanta-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify offline FANTA interface
        env:
          FANTA_PLAYWRIGHT: /tmp/fanta-browser/node_modules/playwright
        run: node --test warhammer/ui.test.cjs workshops/ui.test.cjs
      - name: Publish FANTA UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fanta-offline-ui-evidence
          path: |
            warhammer/test-results/
            workshops/test-results/
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_USER_HOME: /tmp/gamebroth-probe-android
      ANDROID_EMULATOR_HOME: /tmp/gamebroth-probe-android
      ANDROID_AVD_HOME: /tmp/gamebroth-probe-android/avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Add installed Android SDK tools to PATH
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf '%s\n' "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check management and media invariants
        run: |
          node --test perchance/core.test.cjs perchance/media.test.cjs perchance/gallery.test.cjs perchance/albums.test.cjs
          node --check perchance/src/app.js
          node --check perchance/src/gallery.js
          node --test warhammer/core.test.cjs workshops/core.test.cjs
          node --check warhammer/src/app.js
          node warhammer/build.cjs --android-fixture
          node workshops/build.cjs --android-fixture
      - name: Build real APK and instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: perchance-android-probe-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Package official SDK signing utility
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, shutil
          jars = sorted(Path(os.environ['ANDROID_HOME']).joinpath('build-tools').rglob('apksigner.jar'))
          assert jars, 'Android SDK signing utility missing'
          Path('signing-tool').mkdir(exist_ok=True)
          shutil.copyfile(jars[-1], 'signing-tool/apksigner.jar')
          PY
      - name: Publish signing utility
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: signing-tool/apksigner.jar
      - name: Install Android emulator image
        run: |
          sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME" probe-results
          echo no | avdmanager create avd --force --name perchance_probe --package "system-images;android-35;google_apis;x86_64" --device pixel_5 --path "$ANDROID_AVD_HOME/perchance_probe.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s\npath.rel=perchance_probe.avd\ntarget=android-35\n' "$ANDROID_AVD_HOME/perchance_probe.avd" > "$ANDROID_AVD_HOME/perchance_probe.ini"
          emulator -list-avds | tee probe-results/avd-list.txt
          test -f "$ANDROID_AVD_HOME/perchance_probe.avd/config.ini"
      - name: Launch emulator with normal network and WebView
        timeout-minutes: 3
        run: |
          mkdir -p probe-results
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          test -e /dev/kvm
          sudo chown "$(id -un):$(id -gn)" /dev/kvm
          sudo chmod 600 /dev/kvm
          "$EMULATOR" -accel-check >probe-results/acceleration.txt 2>&1
          "$EMULATOR" -avd perchance_probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 -accel on >probe-results/emulator.log 2>&1 &
          timeout 90 adb wait-for-device
          for attempt in $(seq 1 180); do
            if test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put system screen_off_timeout 1800000
      - name: Publish emulator startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-startup-evidence
          path: |
            probe-results/emulator.log
            probe-results/acceleration.txt
      - name: Test compact APK interface offline at 390 and 320 dp
        timeout-minutes: 6
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm list instrumentation
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm density 480
          for width in 390 320; do
            adb shell pm clear com.sendmefile77.gamebroth.hub
            adb shell wm size "$((width * 3))x2532"
            adb shell am force-stop com.google.android.apps.nexuslauncher
            mkdir -p "probe-results/compact-$width"
            adb shell am instrument -w com.sendmefile77.gamebroth.hub.test/com.sendmefile77.gamebroth.probe.CompactUiInstrumentation | tee "probe-results/compact-$width/instrumentation.txt"
            adb logcat -d -s AndroidRuntime ActivityManager chromium > "probe-results/compact-$width/logcat.txt"
            adb pull /sdcard/Android/data/com.sendmefile77.gamebroth.hub/files/compact-ui "probe-results/compact-$width/" || true
          done
      - name: Publish compact UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compact-android-ui-evidence
          path: probe-results/compact-*/
      - name: Require compact Android checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for width in (390, 320):
              path = Path(f'probe-results/compact-{width}/compact-ui/results.json')
              assert path.exists(), f'No UI results at {width} dp'
              results = json.loads(path.read_text())['results']
              print(width, json.dumps(results, ensure_ascii=False, indent=2))
              assert len(results) == 9 and all(r['status'] == 'PASS' for r in results), f'Compact UI failed at {width} dp'
          PY
      - name: Run live Perchance tests on Android
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_network_probe }}
        timeout-minutes: 14
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -e networkProbe true com.sendmefile77.gamebroth.hub.test/com.sendmefile77.gamebroth.probe.CompactUiInstrumentation | tee probe-results/instrumentation.txt
      - name: Collect screenshots and results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_network_probe }}
        run: |
          mkdir -p probe-results
          timeout 10 adb pull /sdcard/Android/data/com.sendmefile77.gamebroth.hub/files/probe probe-results/ || true
          timeout 10 adb logcat -d -s PerchanceProbe chromium >probe-results/logcat.txt || true
      - name: Publish evidence
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run_network_probe }}
        uses: actions/upload-artifact@v4
        with:
          name: perchance-android-probe-evidence
          path: probe-results/
      - name: Require all three live tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_network_probe }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('probe-results/probe/results.json')
          assert p.exists(), 'Android test did not produce a result file'
          results=json.loads(p.read_text())['results']
          print(json.dumps(results,ensure_ascii=False,indent=2))
          assert len(results)==3 and all(r['status']=='PASS' for r in results), 'Some live compatibility checks failed; inspect evidence'
          PY

