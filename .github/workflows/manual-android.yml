name: Manual Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Vulkan shader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev glslc

          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$RUNNER_TEMP/SPIRV-Headers"
          cmake \
            -S "$RUNNER_TEMP/SPIRV-Headers" \
            -B "$RUNNER_TEMP/SPIRV-Headers-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/spirv-headers-install" \
            -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          cmake --build "$RUNNER_TEMP/SPIRV-Headers-build" --target install
          test -f "$RUNNER_TEMP/spirv-headers-install/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake"
          test -f "$RUNNER_TEMP/spirv-headers-install/include/spirv/unified1/spirv.hpp"
          echo "SPIRV_HEADERS_CMAKE_DIR=$RUNNER_TEMP/spirv-headers-install/share/cmake/SPIRV-Headers" >> "$GITHUB_ENV"
          echo "SPIRV_HEADERS_INCLUDE_DIR=$RUNNER_TEMP/spirv-headers-install/include" >> "$GITHUB_ENV"

          # Android NDK exposes libvulkan and the C API headers, but ggml-vulkan also uses
          # the header-only Vulkan-Hpp wrapper. Keep this pinned to the loader generation
          # available on ubuntu-24.04 so CI is reproducible.
          git clone --depth 1 --branch v1.3.275 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/Vulkan-Headers"
          test -f "$RUNNER_TEMP/Vulkan-Headers/include/vulkan/vulkan.hpp"
          test -f "$RUNNER_TEMP/Vulkan-Headers/include/vulkan/vulkan_core.h"
          echo "VULKAN_HEADERS_INCLUDE_DIR=$RUNNER_TEMP/Vulkan-Headers/include" >> "$GITHUB_ENV"
      - name: Create local Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :core:model:test :core:storage:test :core:simulation:test :core:ai-text:test :core:ai-image:test :core:adult-contracts:test
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: game-broth-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
