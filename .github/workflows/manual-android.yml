name: Manual Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      QAIRT_VERSION: 2.48.0.260626
      QAIRT_URL: https://apigwx-aws.qualcomm.com/qsc/public/v1/api/download/software/sdks/Qualcomm_AI_Runtime_Community/All/2.48.0.260626/v2.48.0.260626.zip
    steps:
      # Checkout only the first-party tree before setup-gradle. This keeps Gradle's wrapper
      # validation enabled for this repository instead of failing on sample wrappers nested
      # deep inside pinned third-party sources such as MNN.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: true

      - name: Checkout pinned third-party submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          test "$(git -C third_party/local-dream rev-parse HEAD)" = "9ea3c41ed794902a2206f1654defe2549fcdbf62"
          echo "Local Dream: $(git -C third_party/local-dream rev-parse HEAD)"
          echo "llama.cpp: $(git -C third_party/llama.cpp rev-parse HEAD)"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache cmake ninja-build unzip curl python3

      - name: Download official QAIRT 2.48 Community SDK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qairt"
          curl -fL --retry 3 --retry-delay 3 "$QAIRT_URL" -o "$RUNNER_TEMP/qairt.zip"
          unzip -q "$RUNNER_TEMP/qairt.zip" -d "$RUNNER_TEMP/qairt"
          QNN_INCLUDE="$(find "$RUNNER_TEMP/qairt" -type d -path '*/include/QNN' -print -quit)"
          if [ -z "$QNN_INCLUDE" ]; then
            echo "ERROR: QAIRT archive does not contain include/QNN"
            exit 1
          fi
          QNN_SDK_ROOT="${QNN_INCLUDE%/include/QNN}"
          test -d "$QNN_SDK_ROOT/lib/aarch64-android"
          test -d "$QNN_SDK_ROOT/examples/QNN/SampleApp/SampleApp"
          echo "QNN_SDK_ROOT=$QNN_SDK_ROOT" >> "$GITHUB_ENV"
          echo "QAIRT root: $QNN_SDK_ROOT"

      - name: Adapt Local Dream build to pinned QAIRT 2.48
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("third_party/local-dream/app/src/main/cpp/CMakeLists.txt")
          text = path.read_text()

          text, count = re.subn(
              r"set\(QNN_SDK_ROOT\s+[^\)]+\)",
              'set(QNN_SDK_ROOT "$ENV{QNN_SDK_ROOT}")',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not patch QNN_SDK_ROOT in Local Dream CMakeLists.txt")

          # Local Dream's upstream SampleApp.patch is line-context sensitive and was authored
          # against QAIRT 2.39. Replace that git-apply block with our fail-closed semantic
          # patcher, which targets symbols/regions and therefore supports QAIRT 2.48 layout.
          copy_start = text.find("file(COPY ${QNN_SDK_ROOT}/examples/QNN/SampleApp/SampleApp/")
          runtime_start = text.find("make_directory(${CMAKE_CURRENT_BINARY_DIR}/qnnlibs)", copy_start)
          if copy_start < 0 or runtime_start < 0:
              raise SystemExit("Could not locate Local Dream SampleApp copy/patch block")

          patcher = (Path.cwd() / "scripts/patch_qairt248_sampleapp.py").resolve().as_posix()
          sampleapp_block = f'''file(COPY ${{QNN_SDK_ROOT}}/examples/QNN/SampleApp/SampleApp/
              DESTINATION ${{CMAKE_CURRENT_SOURCE_DIR}}/3rdparty/SampleApp)
          execute_process(
              COMMAND python3 "{patcher}" "${{CMAKE_CURRENT_SOURCE_DIR}}/3rdparty/SampleApp"
              RESULT_VARIABLE patch_result
              OUTPUT_VARIABLE patch_output
              ERROR_VARIABLE patch_error
          )
          message(STATUS "GameBroth QAIRT patch: ${{patch_output}}")
          if(NOT patch_result EQUAL 0)
              message(FATAL_ERROR "GameBroth QAIRT 2.48 SampleApp adaptation failed: ${{patch_error}}")
          endif()

          '''
          text = text[:copy_start] + sampleapp_block + text[runtime_start:]

          runtime_start = text.find("make_directory(${CMAKE_CURRENT_BINARY_DIR}/qnnlibs)")
          runtime_end = text.find("if(WIN32)", runtime_start)
          if runtime_start < 0 or runtime_end < 0:
              raise SystemExit("Could not locate Local Dream QNN runtime copy block")
          dynamic_copy = r'''make_directory(${CMAKE_CURRENT_BINARY_DIR}/qnnlibs)
          file(GLOB QNN_ANDROID_RUNTIME_LIBS
              "${QNN_SDK_ROOT}/lib/aarch64-android/libQnnHtp.so"
              "${QNN_SDK_ROOT}/lib/aarch64-android/libQnnSystem.so"
              "${QNN_SDK_ROOT}/lib/aarch64-android/libQnnHtpV*Stub.so"
          )
          file(GLOB QNN_DSP_RUNTIME_LIBS
              "${QNN_SDK_ROOT}/lib/hexagon-v*/unsigned/libQnnHtpV*.so"
          )
          if(NOT QNN_ANDROID_RUNTIME_LIBS OR NOT QNN_DSP_RUNTIME_LIBS)
              message(FATAL_ERROR "QAIRT SDK does not contain required QNN HTP runtime libraries")
          endif()
          file(COPY ${QNN_ANDROID_RUNTIME_LIBS} ${QNN_DSP_RUNTIME_LIBS}
              DESTINATION ${CMAKE_CURRENT_BINARY_DIR}/qnnlibs)

          '''
          text = text[:runtime_start] + dynamic_copy + text[runtime_end:]
          path.write_text(text)
          PY

          # Android apps share the host network namespace. Keep Local Dream on loopback but
          # require a per-process in-memory token on every endpoint and remove CORS exposure.
          python3 scripts/patch_localdream_loopback_auth.py \
            third_party/local-dream/app/src/main/cpp/src/main.cpp

      - name: Build embedded Local Dream QNN core
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-}}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            echo "ERROR: Android NDK is unavailable on runner"
            exit 1
          fi

          LD_SRC="$GITHUB_WORKSPACE/third_party/local-dream/app/src/main/cpp"
          LD_BUILD="$RUNNER_TEMP/local-dream-build"
          cmake \
            -S "$LD_SRC" \
            -B "$LD_BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_SYSTEM_VERSION=26 \
            -DCMAKE_ANDROID_NDK="$NDK" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_STL=c++_static \
            -DQNN_DEBUG_ENABLE=OFF
          cmake --build "$LD_BUILD" --parallel 2

          CORE="$LD_BUILD/bin/arm64-v8a/libstable_diffusion_core.so"
          test -f "$CORE"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libstable_diffusion_core.so

          mkdir -p app/src/main/assets/qnnlibs
          find "$LD_BUILD/qnnlibs" -maxdepth 1 -type f -name '*.so' -exec cp '{}' app/src/main/assets/qnnlibs/ ';'
          test -f app/src/main/assets/qnnlibs/libQnnHtp.so
          test -f app/src/main/assets/qnnlibs/libQnnSystem.so
          find app/src/main/assets/qnnlibs -maxdepth 1 -type f -name 'libQnnHtpV*Stub.so' | grep -q .
          find app/src/main/assets/qnnlibs -maxdepth 1 -type f -name 'libQnnHtpV*Skel.so' | grep -q .

      - name: Create local Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest :core:model:test :core:storage:test :core:simulation:test :core:ai-text:test :core:ai-image:test :core:adult-contracts:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify embedded Local Dream APK payload
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libstable_diffusion_core.so"
          unzip -l "$APK" | grep -F "assets/qnnlibs/libQnnHtp.so"
          unzip -l "$APK" | grep -F "assets/qnnlibs/libQnnSystem.so"
          unzip -l "$APK" | grep -E "assets/qnnlibs/libQnnHtpV(75|79|81)Stub.so"
          unzip -l "$APK" | grep -E "assets/qnnlibs/libQnnHtpV(75|79|81)(Skel)?.so"
          if unzip -l "$APK" | grep -F "lib/arm64-v8a/libgamebroth_diffusion.so"; then
            echo "ERROR: obsolete stable-diffusion.cpp JNI backend is still packaged"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: game-broth-debug-localdream-qnn248
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
