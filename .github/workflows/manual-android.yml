name: Manual Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create local Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Unit tests
        run: ./gradlew :core:model:test :core:storage:test :core:simulation:test :core:ai-text:test :core:ai-image:test :core:adult-contracts:test
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: game-broth-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
