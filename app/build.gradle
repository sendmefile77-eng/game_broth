plugins { id 'com.android.application' }
android {
  namespace 'com.sendmefile77.gamebroth.probe'
  compileSdk 35
  defaultConfig {
    applicationId 'com.sendmefile77.gamebroth.hub'
    minSdk 26
    targetSdk 35
    versionCode 7
    versionName '0.7-full-height'
    testInstrumentationRunner 'com.sendmefile77.gamebroth.probe.CompactUiInstrumentation'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}


dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
